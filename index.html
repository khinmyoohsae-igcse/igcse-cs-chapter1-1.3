        // State variables
        let currentQuestions = [];
        let currentIndex = 0;
        let userAnswers = {};
        let bookmarked = {};
        let quizMode = 'practice';
        let timerInterval = null;
        let timeRemaining = 45 * 60; // 45 mins in seconds

        // DOM elements
        const setupScreen = document.getElementById('setupScreen');
        const quizScreen = document.getElementById('quizScreen');
        const resultScreen = document.getElementById('resultScreen');
        const themeToggle = document.getElementById('themeToggle');
        
        const modeSelect = document.getElementById('modeSelect');
        const topicSelect = document.getElementById('topicSelect');
        const shuffleAnswersToggle = document.getElementById('shuffleAnswersToggle');
        const startBtn = document.getElementById('startBtn');

        const qCurrent = document.getElementById('qCurrent');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const progressBar = document.getElementById('progressBar');
        const questionCategory = document.getElementById('questionCategory');
        const bookmarkBtn = document.getElementById('bookmarkBtn');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const explanationBox = document.getElementById('explanationBox');
        const explanationText = document.getElementById('explanationText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const gridNav = document.getElementById('gridNav');

        // Theme Toggle Logic
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
        });

        // Initialize / Filter Questions
        startBtn.addEventListener('click', () => {
            quizMode = modeSelect.value;
            const selectedTopic = topicSelect.value;
            
            if (selectedTopic === 'all') {
                currentQuestions = JSON.parse(JSON.stringify(questionsData));
            } else {
                currentQuestions = JSON.parse(JSON.stringify(questionsData.filter(q => q.category === selectedTopic)));
            }

            // Prepare choices
            currentQuestions.forEach(q => {
                let optionsObj = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
                if (shuffleAnswersToggle.checked) {
                    for (let i = optionsObj.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [optionsObj[i], optionsObj[j]] = [optionsObj[j], optionsObj[i]];
                    }
                }
                q.shuffledOptions = optionsObj;
            });

            currentIndex = 0;
            userAnswers = {};
            bookmarked = {};

            setupScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            if (quizMode === 'exam') {
                document.getElementById('timerBox').classList.remove('hidden');
                timeRemaining = 45 * 60;
                startTimer();
                submitBtn.classList.remove('hidden');
            } else {
                document.getElementById('timerBox').classList.add('hidden');
                submitBtn.classList.add('hidden');
            }

            renderGridNav();
            renderQuestion();
        });

        function renderGridNav() {
            gridNav.innerHTML = '';
            currentQuestions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = 'grid-nav-btn';
                btn.innerText = idx + 1;
                
                if (userAnswers[idx] !== undefined) btn.classList.add('answered');
                if (bookmarked[idx]) btn.classList.add('bookmarked');
                
                btn.addEventListener('click', () => {
                    currentIndex = idx;
                    renderQuestion();
                });
                gridNav.appendChild(btn);
            });
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            qCurrent.innerText = `${currentIndex + 1} / ${currentQuestions.length}`;
            questionCategory.innerText = q.topic.toUpperCase();
            questionText.innerText = `${currentIndex + 1}. ${q.question}`;
            
            progressBar.style.width = `${((currentIndex + 1) / currentQuestions.length) * 100}%`;

            bookmarkBtn.innerText = bookmarked[currentIndex] ? "🔖 Bookmarked" : "🔖 Bookmark";
            bookmarkBtn.style.color = bookmarked[currentIndex] ? "var(--accent)" : "inherit";

            optionsContainer.innerHTML = '';
            explanationBox.style.display = 'none';

            const letters = ['A', 'B', 'C', 'D'];
            
            q.shuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                
                const prefix = document.createElement('span');
                prefix.className = 'option-prefix';
                prefix.innerText = `${letters[idx]}.`;
                
                const text = document.createElement('span');
                text.innerText = opt.text;

                btn.appendChild(prefix);
                btn.appendChild(text);

                // Option State in Practice Mode
                if (quizMode === 'practice' && userAnswers[currentIndex] !== undefined) {
                    if (opt.originalIndex === q.correct) {
                        btn.classList.add('correct');
                    }
                    if (userAnswers[currentIndex] === idx && opt.originalIndex !== q.correct) {
                        btn.classList.add('incorrect');
                    }
                } else if (userAnswers[currentIndex] === idx) {
                    btn.classList.add('selected');
                }

                btn.addEventListener('click', () => selectAnswer(idx));
                optionsContainer.appendChild(btn);
            });

            if (quizMode === 'practice' && userAnswers[currentIndex] !== undefined) {
                explanationText.innerText = q.explanation;
                explanationBox.style.display = 'block';
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.innerText = currentIndex === currentQuestions.length - 1 ? "Finish" : "Next";
            updateScoreDisplay();
        }

        function selectAnswer(optionIndex) {
            userAnswers[currentIndex] = optionIndex;
            renderGridNav();
            renderQuestion();
        }

        bookmarkBtn.addEventListener('click', () => {
            bookmarked[currentIndex] = !bookmarked[currentIndex];
            renderGridNav();
            renderQuestion();
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                finishQuiz();
            }
        });

        submitBtn.addEventListener('click', () => {
            if (confirm("Are you sure you want to submit your exam?")) {
                finishQuiz();
            }
        });

        function updateScoreDisplay() {
            let correctCount = 0;
            Object.keys(userAnswers).forEach(idx => {
                const q = currentQuestions[idx];
                const selectedOptIndex = userAnswers[idx];
                if (selectedOptIndex !== undefined) {
                    const origIndex = q.shuffledOptions[selectedOptIndex].originalIndex;
                    if (origIndex === q.correct) correctCount++;
                }
            });
            scoreDisplay.innerText = correctCount;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                const mins = Math.floor(timeRemaining / 60);
                const secs = timeRemaining % 60;
                timerDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert("Time's up! Submitting your exam.");
                    finishQuiz();
                }
            }, 1000);
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            let score = 0;
            currentQuestions.forEach((q, idx) => {
                const selectedOptIndex = userAnswers[idx];
                if (selectedOptIndex !== undefined) {
                    if (q.shuffledOptions[selectedOptIndex].originalIndex === q.correct) {
                        score++;
                    }
                }
            });

            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            document.getElementById('finalScore').innerText = `${score} / ${currentQuestions.length}`;
            const percentage = Math.round((score / currentQuestions.length) * 100);
            document.getElementById('percentageDisplay').innerText = `${percentage}% Score`;
        }

        document.getElementById('restartBtn').addEventListener('click', () => {
            resultScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        });
    </script>
